<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 340px;
      margin: 0;
      padding: 16px;
      color: #1a1a1a;
    }
    h1 { font-size: 15px; margin: 0 0 12px; }
    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #cc0000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #a30000; }
    button:disabled { background: #999; cursor: not-allowed; }
    .status { margin-top: 12px; font-size: 13px; min-height: 18px; }
    .status.error { color: #cc0000; }
    .status.success { color: #0a7d28; }
    .cookie {
      margin-top: 10px;
      background: #f4f4f4;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      word-break: break-all;
    }
    .cookie label { display: block; font-weight: 600; margin-bottom: 2px; }
    .cookie code { color: #333; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>ESPN Cookie Extractor</h1>
  <button id="extract">Extract Cookies</button>
  <div id="status" class="status"></div>

  <div id="result" class="hidden">
    <div class="cookie">
      <label>espn_s2</label>
      <code id="s2"></code>
    </div>
    <div class="cookie">
      <label>SWID</label>
      <code id="swid"></code>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
